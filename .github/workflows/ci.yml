name: Offline checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: macOS arm64 offline verification
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
          swift package dump-package >/dev/null
      - name: Verify runtime and fixture gates
        run: python3 scripts/verify.py
      - name: Verify distributable app
        run: python3 scripts/package_app.py --archive --version 1.0.0
