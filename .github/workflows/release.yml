name: Release main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# GitHub may replace pending runs. The controller drains every unreleased main
# commit, so a replaced run cannot lose a release or a version increment.
concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.3'
      - name: Publish all pending main revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
